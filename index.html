        // Format Tanggal (Besok, Hari Ini, dll) + Styling Mockup (Merah vs Biru)
        function formatDeadline(dateString) {
            const deadline = new Date(dateString);
            deadline.setHours(23, 59, 59, 999);
            const now = new Date();
            const diffDays = Math.ceil((deadline - now) / (1000 * 60 * 60 * 24));

            let text = deadline.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            
            // Konsep Mockup: Kalau dekat deadline -> Merah, kalau masih lama -> Biru/Cyan
            let styleTheme = 'red'; 

            if (diffDays < 0) {
                text = `Terlewat ${Math.abs(diffDays)} hari`;
                styleTheme = 'red';
            } else if (diffDays === 0) {
                text = 'Hari ini!';
                styleTheme = 'red';
            } else if (diffDays === 1) {
                text = 'Besok';
                styleTheme = 'red';
            } else if (diffDays <= 3) {
                text = `Sisa ${diffDays} hari`;
                styleTheme = 'red';
            } else {
                styleTheme = 'blue';
            }

            return { text, styleTheme };
        }
