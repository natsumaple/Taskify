<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohon Bersabar</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6ec,#d6f0ff);
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
}

.card{
    text-align:center;
    background:rgba(255,255,255,0.9);
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.chibi{
    width:120px;
    height:120px;
    margin:auto;
    position:relative;
    animation:bounce 1.5s infinite;
}

.face{
    width:100px;
    height:100px;
    background:#ffe6d5;
    border-radius:50%;
    position:absolute;
    left:10px;
    top:10px;
}

.hair{
    width:110px;
    height:60px;
    background:#7a4cff;
    border-radius:60px 60px 30px 30px;
    position:absolute;
    left:5px;
    top:0;
}

.eye{
    width:10px;
    height:18px;
    background:#222;
    border-radius:50%;
    position:absolute;
    top:45px;
}

.eye.left{left:35px;}
.eye.right{right:35px;}

.mouth{
    width:18px;
    height:8px;
    border-bottom:3px solid #ff5e8a;
    border-radius:50%;
    position:absolute;
    left:51px;
    top:68px;
}

h1{
    color:#ff4f8b;
    margin-top:20px;
    font-size:28px;
}

p{
    color:#555;
    font-size:18px;
}

.dots::after{
    content:"";
    animation:dots 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

@keyframes dots{
    0%{content:"";}
    25%{content:".";}
    50%{content:"..";}
    75%{content:"...";}
    100%{content:"";}
}
</style>
</head>
<body>

<div class="card">

    <div class="chibi">
        <div class="hair"></div>
        <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
        </div>
    </div>

    <h1>Mohon Bersabar</h1>

    <p>
        Lagi disetting databasenya
        <span class="dots"></span>
    </p>

    <p><small>૮ ˶ᵔ ᵕ ᵔ˶ ა Sedang bekerja keras!</small></p>

</div>

</body>
</html>
